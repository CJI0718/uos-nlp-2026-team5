<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1560" viewBox="0 0 1200 1560" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#067647"/>
    </marker>
  </defs>
  <rect width="1200" height="1560" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0b3d91">하네스 서버 게이트의 구조</text>
  <text x="40" y="84" font-size="16" fill="#57606a">src/task_a/mcp_server.py · tools.py · claim_gate.py · missions.py — 검사가 실행되는 순서대로</text>

  <!-- Agent box -->
  <rect x="40" y="110" width="300" height="96" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="190" y="148" font-size="20" font-weight="700" text-anchor="middle" fill="#312e81">에이전트 (모델)</text>
  <text x="190" y="176" font-size="15" text-anchor="middle" fill="#312e81">DeepSeek · Claude · GPT 등</text>
  <text x="190" y="196" font-size="13" text-anchor="middle" fill="#4b5563">도구 호출 또는 판정 제출만 할 수 있음</text>

  <!-- ============ Stage 1: tool calls ============ -->
  <rect x="400" y="110" width="760" height="470" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="420" y="144" font-size="21" font-weight="700" fill="#0f172a">① 도구 단계 — 매 도구 호출마다 (call_tool)</text>
  <text x="420" y="168" font-size="14" fill="#475569">에이전트가 근거를 모으는 동안 작동. 막히면 이유를 돌려주고 에피소드는 계속됨</text>

  <g font-size="15" fill="#0f172a">
    <rect x="420" y="184" width="350" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="434" y="208" font-weight="700">조건 제한</text>
    <text x="434" y="232" font-size="13.5" fill="#334155">C0는 도구 차단 · 조건에 없는 도구는 목록에서 숨김</text>

    <rect x="790" y="184" width="350" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="804" y="208" font-weight="700">예산</text>
    <text x="804" y="232" font-size="13.5" fill="#334155">도구 호출 상한 · 외부 호출(검색·열기) 상한</text>

    <rect x="420" y="258" width="350" height="62" rx="8" fill="#ecfdf3" stroke="#6ce9a6"/>
    <text x="434" y="282" font-weight="700">재사용 <tspan font-size="12" fill="#067647">[v3]</tspan></text>
    <text x="434" y="306" font-size="13.5" fill="#334155">같은 검색어 · 이미 연 페이지 → 외부 호출 없이 이전 결과</text>

    <rect x="790" y="258" width="350" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="804" y="282" font-weight="700">기준 시점 필터</text>
    <text x="804" y="306" font-size="13.5" fill="#334155">evidence_cutoff 이후 발행 결과·페이지 차단</text>

    <rect x="420" y="332" width="350" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="434" y="356" font-weight="700">정답 저장소 차단</text>
    <text x="434" y="380" font-size="13.5" fill="#334155">공개된 우리 저장소는 검색·열기·리다이렉트 모두 차단</text>

    <rect x="790" y="332" width="350" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="804" y="356" font-weight="700">주소 차단</text>
    <text x="804" y="380" font-size="13.5" fill="#334155">로컬·사설 주소는 열 수 없음</text>

    <rect x="420" y="406" width="720" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="434" y="432" font-weight="700">읽은 문서 기록 (나중 검사의 기준)</text>
    <text x="434" y="458" font-size="13.5" fill="#334155">본문을 연 문서(read_evidence · fetch_url · find_in_page)만 "읽음"으로 기록하고 전문 보관. 스니펫만 본 문서는 제외</text>
  </g>
  <text x="420" y="508" font-size="14" fill="#475569">도구: 자료집 검색·열람 · 웹 검색 · 페이지 열기 · find_in_page [v3] · 계산기(차이·비율·시간대·단위)</text>
  <text x="420" y="534" font-size="14" fill="#475569">모든 호출은 실행 기록(events)에 남음 → 채점에서 "읽지 않은 인용" 계산에 사용</text>
  <text x="420" y="560" font-size="13" fill="#94a3b8">C2P(하네스 없음)도 기준 시점 필터·저장소 차단·외부 호출 상한은 같이 적용 (평가 규칙)</text>

  <!-- arrows agent <-> tools -->
  <path d="M340 140 L398 140" stroke="#374151" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <text x="344" y="130" font-size="13" fill="#374151">도구 호출</text>
  <path d="M398 190 L342 190" stroke="#374151" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <text x="346" y="210" font-size="13" fill="#374151">결과</text>

  <!-- agent -> finish -->
  <path d="M190 206 L190 640" stroke="#374151" stroke-width="2.4" fill="none" marker-end="url(#a)"/>
  <rect x="60" y="400" width="260" height="62" rx="8" fill="#ffffff" stroke="#374151"/>
  <text x="190" y="426" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">finish_verification</text>
  <text x="190" y="448" font-size="13" text-anchor="middle" fill="#374151">판정 · 인용 · 근거 문장 · 정정 제출</text>

  <!-- ============ Stage 2: finish checks ============ -->
  <rect x="40" y="640" width="1120" height="610" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="676" font-size="21" font-weight="700" fill="#0f172a">② 제출 단계 — 판정을 받기 전에 순서대로 검사 (finish_episode)</text>
  <text x="60" y="700" font-size="14" fill="#475569">하나라도 걸리면 판정을 기록하지 않고 사유를 돌려줌 → 에이전트가 고쳐 다시 제출</text>

  <!-- check boxes column -->
  <g font-size="15">
    <!-- 0 -->
    <rect x="60" y="716" width="700" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="76" y="740" font-weight="700" fill="#0f172a">0. 필수 항목</text>
    <text x="76" y="762" font-size="13.5" fill="#334155">판정(verdict)과 이유(justification)가 있어야 함</text>

    <!-- 1 -->
    <rect x="60" y="782" width="700" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="76" y="806" font-weight="700" fill="#0f172a">1. 원래 글 인용 금지 <tspan font-size="12" fill="#6941c6">[--block-self-citation]</tspan></text>
    <text x="76" y="828" font-size="13.5" fill="#334155">인용 중 하나라도 주장이 나온 글(source_url)과 같은 페이지면 거절</text>

    <!-- 2 -->
    <rect x="60" y="848" width="700" height="72" rx="8" fill="#ecfdf3" stroke="#6ce9a6"/>
    <text x="76" y="872" font-weight="700" fill="#0f172a">2. 주장 유형 정하기 <tspan font-size="12" fill="#067647">[v3]</tspan></text>
    <text x="76" y="894" font-size="13.5" fill="#334155">문구로 서버가 먼저 판정: "~로 전망했다/발표했다" → 발언 · "~할 것이다", will → 예측</text>
    <text x="76" y="912" font-size="13.5" fill="#334155">서버가 못 정하면 에이전트가 적은 claim_kind, 없으면 사실. 에이전트가 우회할 수 없음</text>

    <!-- 3 -->
    <rect x="60" y="930" width="700" height="56" rx="8" fill="#ecfdf3" stroke="#6ce9a6"/>
    <text x="76" y="954" font-weight="700" fill="#0f172a">3. 판정이 근거 부족이면 → 아래 검사 없이 통과 <tspan font-size="12" fill="#067647">[v3]</tspan></text>
    <text x="76" y="976" font-size="13.5" fill="#334155">지지·반박만 근거 문장을 요구함</text>

    <!-- 4 -->
    <rect x="60" y="996" width="700" height="56" rx="8" fill="#ecfdf3" stroke="#6ce9a6"/>
    <text x="76" y="1020" font-weight="700" fill="#0f172a">4. 예측 주장을 "전망을 사실처럼 썼다"로 반박? <tspan font-size="12" fill="#067647">[v3]</tspan></text>
    <text x="76" y="1042" font-size="13.5" fill="#334155">예측 + 반박 + forecast_as_fact → 거절 ("근거 부족으로 내세요")</text>

    <!-- 5 -->
    <rect x="60" y="1062" width="700" height="72" rx="8" fill="#ecfdf3" stroke="#6ce9a6"/>
    <text x="76" y="1086" font-weight="700" fill="#0f172a">5. 인용문 대조 (evidence_quote) <tspan font-size="12" fill="#067647">[v3]</tspan></text>
    <text x="76" y="1108" font-size="13.5" fill="#334155">없음 · 400자 초과 → 거절. 인용한 문서 중 "읽은" 문서 본문에 글자 그대로 없으면 거절</text>
    <text x="76" y="1126" font-size="13.5" fill="#334155">(공백·따옴표 무시, '…'로 생략 가능, 조각마다 8자 이상)</text>

    <!-- 6 -->
    <rect x="60" y="1144" width="700" height="72" rx="8" fill="#ecfdf3" stroke="#6ce9a6"/>
    <text x="76" y="1168" font-weight="700" fill="#0f172a">6. 예측 주장의 인용문에 보도·추측 표현? <tspan font-size="12" fill="#067647">[v3]</tspan></text>
    <text x="76" y="1190" font-size="13.5" fill="#334155">"전해졌", "알려졌", "전망", "예상", "확률", reportedly, expected, likely … → 거절</text>
    <text x="76" y="1208" font-size="13.5" fill="#334155">("공식 확정 발표를 인용하거나 근거 부족으로 내세요")</text>
  </g>

  <!-- vertical flow arrows between checks -->
  <g stroke="#067647" stroke-width="2" fill="none">
    <path d="M745 772 L745 780" marker-end="url(#g)"/>
    <path d="M745 838 L745 846" marker-end="url(#g)"/>
    <path d="M745 920 L745 928" marker-end="url(#g)"/>
    <path d="M745 986 L745 994" marker-end="url(#g)"/>
    <path d="M745 1052 L745 1060" marker-end="url(#g)"/>
    <path d="M745 1134 L745 1142" marker-end="url(#g)"/>
  </g>

  <!-- reject column -->
  <rect x="830" y="716" width="310" height="300" rx="12" fill="#fef3f2" stroke="#f04438" stroke-width="2"/>
  <text x="985" y="750" font-size="19" font-weight="700" text-anchor="middle" fill="#b42318">거절 (돌려보냄)</text>
  <text x="850" y="784" font-size="14" fill="#7a271a">• 판정을 기록하지 않음</text>
  <text x="850" y="810" font-size="14" fill="#7a271a">• 사유 메시지를 에이전트에게 반환</text>
  <text x="850" y="836" font-size="14" fill="#7a271a">• 에피소드는 계속 열려 있음</text>
  <text x="850" y="862" font-size="14" fill="#7a271a">• 거절 사유는 gate_refusals에 누적</text>
  <text x="850" y="896" font-size="14" font-weight="700" fill="#7a271a">에이전트 선택:</text>
  <text x="850" y="920" font-size="14" fill="#7a271a">근거를 더 찾거나 · 문장을 고치거나</text>
  <text x="850" y="944" font-size="14" fill="#7a271a">· 근거 부족으로 다시 제출</text>
  <text x="850" y="980" font-size="13" fill="#9a3412">예: FC017·FC026·FC041은 거절 뒤</text>
  <text x="850" y="1000" font-size="13" fill="#9a3412">근거 부족으로 바뀌어 정답 (exp-014)</text>

  <!-- reject arrows from checks -->
  <g stroke="#b42318" stroke-width="1.8" fill="none" stroke-dasharray="6 4">
    <path d="M760 744 L828 744" marker-end="url(#r)"/>
    <path d="M760 810 L828 800" marker-end="url(#r)"/>
    <path d="M760 1024 L828 960" marker-end="url(#r)"/>
    <path d="M760 1098 L828 990" marker-end="url(#r)"/>
    <path d="M760 1180 L828 1005" marker-end="url(#r)"/>
  </g>

  <!-- back to agent arrow -->
  <path d="M1150 716 L1180 716 L1180 600 L1180 60 L20 60 L20 158 L38 158" stroke="#b42318" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="1168" y="400" font-size="13" fill="#b42318" text-anchor="end">사유와 함께 에이전트로 ↑</text>

  <!-- accept -->
  <rect x="830" y="1040" width="310" height="176" rx="12" fill="#ecfdf3" stroke="#12b76a" stroke-width="2"/>
  <text x="985" y="1074" font-size="19" font-weight="700" text-anchor="middle" fill="#067647">통과 → 판정 기록</text>
  <text x="850" y="1106" font-size="14" fill="#05603a">판정 · 인용 · 정정 · 왜곡 유형</text>
  <text x="850" y="1130" font-size="14" fill="#05603a">claim_kind · evidence_quote</text>
  <text x="850" y="1154" font-size="14" fill="#05603a">gate_refusals · 도구 호출 궤적</text>
  <text x="850" y="1178" font-size="14" fill="#05603a">→ 실행 기록(run.jsonl)</text>
  <text x="850" y="1202" font-size="13" fill="#05603a">채점기는 이 기록만 읽음</text>
  <path d="M760 1196 L828 1150" stroke="#067647" stroke-width="2.2" fill="none" marker-end="url(#g)"/>

  <!-- ============ Stage 3: mission gate ============ -->
  <rect x="40" y="1272" width="1120" height="200" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="1306" font-size="21" font-weight="700" fill="#0f172a">③ 미션 단계 — mission_type을 요청했을 때만 (validate_mission_gate)</text>
  <text x="60" y="1330" font-size="14" fill="#475569">판정은 이미 기록됨. 막히면 미션만 실행하지 않고 차단 사유를 기록</text>
  <g font-size="14" fill="#334155">
    <rect x="60" y="1346" width="340" height="106" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="76" y="1372" font-weight="700" fill="#0f172a" font-size="15">실행형 미션</text>
    <text x="76" y="1396">일정(.ics) · 결과 정리(.md)</text>
    <text x="76" y="1418">기회 준비 문서 · 앱 점검 문서</text>
    <text x="76" y="1440" fill="#64748b">추적 등록 · 보류 · no_op은 게이트 대상 아님</text>

    <rect x="420" y="1346" width="720" height="106" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="436" y="1372">• 근거 부족이거나 판정 보류(abstain)면 차단</text>
    <text x="436" y="1396">• 인용이 하나 이상 있어야 하고, 모두 이번 에피소드에서 읽은 문서여야 함</text>
    <text x="436" y="1420">• 반박이면 정정문 필수 (일정은 정정문에 같은 HH:MM)</text>
    <text x="436" y="1444" fill="#6941c6">• [--gate provenance] 1차 출처가 있거나 서로 다른 출처군 2개 이상</text>
  </g>
  <path d="M985 1216 L985 1270" stroke="#067647" stroke-width="2.2" fill="none" marker-end="url(#g)"/>

  <!-- legend -->
  <g font-size="13.5">
    <rect x="40" y="1494" width="18" height="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="66" y="1508" fill="#334155">기본 하네스 (항상)</text>
    <rect x="230" y="1494" width="18" height="18" fill="#ecfdf3" stroke="#6ce9a6"/>
    <text x="256" y="1508" fill="#334155">하네스 v3 (--harness-v3)</text>
    <text x="470" y="1508" fill="#6941c6">[옵션] 실행 옵션으로 켜는 검사</text>
    <text x="720" y="1508" fill="#334155">─ ─ 빨간 점선: 거절되어 에이전트로 돌아감</text>
  </g>
  <text x="40" y="1540" font-size="12.5" fill="#94a3b8">게이트는 형식(근거 문장이 본문에 있는가, 보도 표현이 있는가)만 검사하고, 그 문장이 판정을 실제로 뒷받침하는지는 판단하지 않음.</text>
</svg>
