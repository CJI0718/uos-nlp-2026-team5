[project]
name = "task-a-factcheck"
version = "0.1.0"
description = "NLP Team 5 Task A - fact-checking agent under imperfect evidence"
requires-python = ">=3.12"
dependencies = [
    "kiwipiepy>=0.24.1",
    "openai>=3.46.0",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
