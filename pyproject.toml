[project]
name = "task-a-factcheck"
version = "0.1.0"
description = "NLP Team 5 Task A - fact-checking agent under imperfect evidence"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_a"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
